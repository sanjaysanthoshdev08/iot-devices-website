# HYKON IoT platform: database + backend + website in one command:
#   docker compose up -d --build
# Settings come from the .env file (copy .env.example to .env and fill it in).

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hykon_iot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hykon_iot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-hykon_iot}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost}
      SPRING_JPA_SHOW_SQL: "false"
      HYKON_ADMIN_EMAIL: ${HYKON_ADMIN_EMAIL:-}
      HYKON_ADMIN_PASSWORD: ${HYKON_ADMIN_PASSWORD:-}
      OVERSEER_EMAIL: ${OVERSEER_EMAIL:-}
      OVERSEER_PASSWORD: ${OVERSEER_PASSWORD:-}
    ports:
      # Local testing only: the website in Docker on http://localhost talks to the backend on 8080.
      # On a real server, remove this line: Nginx reaches the backend privately through /api.
      - "${BACKEND_PORT:-8080}:8080"

  db-setup:
    image: postgres:17-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hykon_iot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./docker/apply-migrations.sh:/apply-migrations.sh:ro
      - ./backend/sql:/sql:ro
    entrypoint: ["sh", "-c", "sed 's/\r$//' /apply-migrations.sh | sh"]
    restart: "no"

  frontend:
    build: .
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  pgdata:
