
spring.application.name=iot-backend

# PostgreSQL Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hykon_iot}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=900000

# Refresh Token Configuration
# 7 days in milliseconds
jwt.refresh-token-expiration=604800000

# CORS Configuration
# Allowed Angular frontend origin for local development
app.cors.allowed-origins=http://localhost:4200

# Password reset email (optional)
# Email is sent only when SPRING_MAIL_HOST is set as an environment variable,
# together with SPRING_MAIL_PORT, SPRING_MAIL_USERNAME and SPRING_MAIL_PASSWORD.
# Without it, reset codes are written to the backend log instead.
app.mail.from=${MAIL_FROM:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Keep /actuator/health independent of the mail server.
management.health.mail.enabled=false
